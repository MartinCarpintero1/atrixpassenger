
spring.application.name=atrix-passenger-backend

# Server configuration
server.port=${PORT:8080}

# Database configuration - PostgreSQL (Supabase)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
# Lista separada por comas. Admite patrones (https://atrixpassenger-*.vercel.app).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://atrixpassenger.vercel.app,https://atrixpassenger-*.vercel.app}

# Registro público de operadores: sólo habilitado si se define este código.
app.staff.registration-code=${STAFF_REGISTRATION_CODE:}

# Administrador inicial
app.bootstrap.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.name=${BOOTSTRAP_ADMIN_NAME:}